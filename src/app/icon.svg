<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133857" />
      <stop offset="100%" stop-color="#091b2c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Washer Outer Ring -->
  <circle cx="256" cy="275" r="156" stroke="#ffffff" stroke-opacity="0.1" stroke-width="22"/>
  <circle cx="256" cy="275" r="156" stroke="url(#greenGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- Spinning Drum Arc -->
  <circle cx="256" cy="275" r="116" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="530 180"/>

  <!-- Inner Water Drum Chamber -->
  <circle cx="256" cy="275" r="86" fill="#0284c7" fill-opacity="0.22"/>

  <!-- Crisp Water Waves -->
  <path d="M194 282 C214 262, 234 302, 256 282 C278 262, 298 302, 318 282" stroke="#38bdf8" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M210 314 C226 300, 242 328, 256 314 C270 300, 286 328, 302 314" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="11" stroke-linecap="round" fill="none"/>

  <!-- Large Sparkle Diamond (Top Left) -->
  <path d="M155 76 Q155 136, 95 136 Q155 136, 155 196 Q155 136, 215 136 Q155 136, 155 76 Z" fill="url(#greenGrad)" filter="url(#glow)"/>

  <!-- Medium Sparkle Diamond (Top Right) -->
  <path d="M365 96 Q365 136, 325 136 Q365 136, 365 176 Q365 136, 405 136 Q365 136, 365 96 Z" fill="url(#cyanGrad)"/>

  <!-- Accents -->
  <circle cx="395" cy="216" r="9" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="120" cy="235" r="7" fill="#4ade80" fill-opacity="0.8"/>
</svg>
